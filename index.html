<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="converter-container">
    <header>
        <h1>محول العملات العالمي</h1>
    </header>

    <div class="form-group">
        <label for="amount">المبلغ المراد تحويله</label>
        <input type="number" id="amount" placeholder="مثلاً: 100" value="5">
    </div>

    <div class="form-group">
        <label for="from-currency">من عملة</label>
        <select id="from-currency">
            <option value="USD">USD - دولار أمريكي</option>
            <option value="EUR">EUR - يورو</option>
            <option value="GBP">GBP - جنيه إسترليني</option>
            <option value="SAR">SAR - ريال سعودي</option>
            <option value="EGP">EGP - جنيه مصري</option>
            <option value="AED">AED - درهم إماراتي</option>
             <option value="DZD">DZD - دينار جزائري</option>
        </select>
    </div>

    <div class="form-group">
        <label for="to-currency">إلى عملة</label>
        <select id="to-currency">
            <option value="EUR">EUR - يورو</option>
            <option value="USD">USD - دولار أمريكي</option>
            <option value="SAR">SAR - ريال سعودي</option>
            <option value="DZD">DZD - دينار جزائري</option>
            <option value="MAD">MAD - درهم مغربي</option>
            <option value="TRY">TRY - ليرة تركية</option>
        </select>
    </div>

    <button class="convert-btn" id="convert-btn">تحويل الآن</button>

    <div class="result-section">
        <p id="rate-info">جاري جلب الأسعار...</p>
        <span id="converted-amount">0.00</span>
    </div>
</div>

<script>
document.getElementById('convert-btn').addEventListener('click', async () => {
    const amount = document.getElementById('amount').value;
    const from = document.getElementById('from-currency').value;
    const to = document.getElementById('to-currency').value;
    const resultElement = document.getElementById('converted-amount');
    const rateElement = document.getElementById('rate-info');

    if (amount <= 0 || amount === "") {
        alert(" راك تحرش ");
        return;
    }

    resultElement.innerText = "جاري التحويل...";

    try {
        // الاتصال بـ API مجاني لجلب أحدث الأسعار
        const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        const data = await response.json();
        
        const rate = data.rates[to];
        const total = (amount * rate).toLocaleString(undefined, {minimumFractionDigits: 2});

        rateElement.innerText = `سعر الصرف الحالي: 1 ${from} = ${rate.toFixed(4)} ${to}`;
        resultElement.innerText = `${total} ${to}`;
    } catch (error) {
        resultElement.innerText = "خطأ!";
        rateElement.innerText = "فشل الاتصال بالخادم، حاول لاحقاً.";
    }
});

// تشغيل تحويل تلقائي عند فتح الصفحة لأول مرة
window.onload = () => document.getElementById('convert-btn').click();
</script>

</body>
</html>
